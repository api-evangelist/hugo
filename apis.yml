aid: hugo
name: Hugo
description: >-
  Hugo is a mobile-first, usage-based car insurance company that lets drivers
  turn coverage on and off from their phone and pay in short intervals rather
  than a large upfront down payment. Through the Hugo app and web portal,
  customers can activate liability or comprehensive coverage in minutes, get
  instant proof of insurance, auto-reload their balance, and extend protection
  as needed. Hugo positions itself as a modern, micropayment alternative to
  traditional insurers for budget-conscious and gig-economy drivers, and is a
  seed-stage InsurTech company backed by Canaan Partners. Hugo operates in
  select U.S. states with expansion underway. Hugo is a consumer insurance
  application and does not currently publish a public API or developer program.
